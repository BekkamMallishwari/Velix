name: Windows Sandbox CI

on:
  push:
    branches:
      - main
      - feat/tool-layer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Run Windows Sandbox Tests
      run: |
        pytest tests/unit/test_sandbox_windows.py -v

    - name: Run All Sandbox Tests
      run: |
        pytest tests/unit/test_sandbox_cross_platform.py tests/unit/test_sandbox_windows.py -v

    - name: Run Ruff
      run: |
        ruff check src tests

    - name: Run Mypy
      run: |
        mypy src/velix_agent/sandbox/ tests/unit/test_sandbox_windows.py
