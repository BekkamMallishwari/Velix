name: Windows Sandbox CI

# Runs Windows-specific sandbox tests using the Win32 Job Object backend.
#
# DOCUMENTED LIMITATIONS (not tested here):
#   - filesystem_isolation: UNSUPPORTED — no AppContainer isolation implemented yet.
#   - network_isolation:    UNSUPPORTED — no WFP/firewall-based isolation implemented yet.
#
# Tests in tests/sandbox/test_sandbox_security.py that require filesystem or
# network isolation are SKIPPED on Windows because the capability object
# explicitly reports UNSUPPORTED.  A skip is NOT treated as evidence of support.

on:
  push:
    branches:
      - main
      - feat/tool-layer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    # Print capabilities so the CI log shows what IS supported on Windows
    - name: Print sandbox capabilities
      run: |
        python -c "
        from velix_agent.sandbox.manager import SandboxManager
        caps = SandboxManager().get_capabilities()
        print('filesystem_isolation :', caps.filesystem_isolation)
        print('network_isolation    :', caps.network_isolation)
        print('timeout              :', caps.timeout)
        print('output_limit         :', caps.output_limit)
        print('secret_filtering     :', caps.secret_filtering)
        print('memory_limit         :', caps.memory_limit)
        print('process_limit        :', caps.process_limit)
        print('disk_limit           :', caps.disk_limit)
        "

    - name: Run Windows Sandbox Tests
      run: |
        python -m pytest tests/unit/test_sandbox_windows.py -v --tb=short

    - name: Run cross-platform sandbox tests
      run: |
        python -m pytest tests/unit/test_sandbox_cross_platform.py tests/unit/test_sandbox_windows.py -v --tb=short

    # Security tests run on Windows but skip isolation-dependent cases
    - name: Run sandbox security tests (Windows — isolation tests will skip)
      run: |
        python -m pytest tests/sandbox/test_sandbox_security.py -v --tb=short

    - name: Run sandbox secrets integration tests
      run: |
        python -m pytest tests/sandbox/test_sandbox_secrets_integration.py -v --tb=short

    # Stress tests run on Windows — capability-aware, will skip POSIX-only cases
    - name: Run bounded sandbox stress tests (Windows — POSIX-only cases will skip)
      run: |
        python -m pytest tests/sandbox/test_sandbox_stress.py -v --tb=short

    - name: Run Ruff
      run: |
        ruff check tests/sandbox/

    - name: Run Mypy
      run: |
        mypy src/velix_agent/sandbox/ tests/unit/test_sandbox_windows.py
