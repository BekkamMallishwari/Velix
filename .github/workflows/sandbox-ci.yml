---
# yamllint disable rule:line-length
name: Sandbox CI

# Unified cross-platform sandbox CI workflow testing Linux, macOS, and Windows.
#
# PLATFORM CAPABILITIES & LIMITATIONS:
#   - Linux:
#       * Backend: Bubblewrap (bwrap) with unprivileged namespaces.
#       * Filesystem & network isolation: SUPPORTED.
#       * Resource limits: timeout=SUPPORTED, cgroups=DETECTED (informational, not yet enforced).
#   - macOS:
#       * Backend: Apple sandbox-exec (Seatbelt) profile generation.
#       * Filesystem & network isolation: SUPPORTED.
#       * Resource limits: timeout=SUPPORTED, RLIMIT_CPU=SUPPORTED.
#       * KNOWN LIMITATION: Double-forked processes that reparent to PID 1 (launchd)
#         escape user-space process-tree walk (_terminate_process_tree) because Darwin
#         lacks kernel PID namespaces. A green CI run confirms workspace isolation and
#         session-leader termination, but NOT complete process-tree containment.
#   - Windows:
#       * Backend: Win32 Job Object (via ctypes / SetInformationJobObject).
#       * Process limits & timeout: SUPPORTED (Job Object handles process containment & termination).
#       * Filesystem & network isolation: UNSUPPORTED (no AppContainer or WFP firewall yet).
#       * Tests requiring unsupported isolation are capability-skipped; skips are NOT proof of support.

'on':
  push:
    branches:
      - main
      - feat/tool-layer
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            backend_test: tests/unit/test_sandbox_linux.py
          - name: macOS
            os: macos-latest
            backend_test: tests/unit/test_sandbox_macos.py
          - name: Windows
            os: windows-latest
            backend_test: tests/unit/test_sandbox_windows.py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Platform-specific system dependencies
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bubblewrap

      # Install project and dev dependencies using uv into system environment
      - name: Install Python dependencies
        run: |
          uv pip install --system -e ".[dev]"

      # Linux prerequisites & security guards
      - name: Verify bwrap functional sandbox execution (Linux)
        if: runner.os == 'Linux'
        run: |
          which bwrap || (echo "ERROR: bwrap not found after installation" && exit 1)
          bwrap --version
          # Verify unprivileged user namespace and filesystem bind container execution
          bwrap --ro-bind / / -- true || (echo "ERROR: bwrap container execution failed" && exit 1)
          # Verify unprivileged network namespace container execution
          bwrap --unshare-net --ro-bind / / -- true || (echo "ERROR: bwrap unshare-net execution failed" && exit 1)

      - name: Detect systemd-run cgroup availability (Linux, informational only)
        if: runner.os == 'Linux'
        run: |
          if systemd-run --user --scope --quiet --no-ask-password -p MemoryMax=1M true 2>/dev/null; then
            echo "SYSTEMD_CGROUPS_AVAILABLE=true" >> "$GITHUB_ENV"
            echo "INFO: systemd cgroups are available on this runner (not yet enforced)."
          else
            echo "SYSTEMD_CGROUPS_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "INFO: systemd cgroups are NOT available. Linux cgroup limits are not yet implemented."
          fi

      # macOS prerequisites & security guards
      - name: Verify sandbox-exec is available (macOS)
        if: runner.os == 'macOS'
        run: |
          which sandbox-exec || (echo "ERROR: sandbox-exec not found on macOS runner" && exit 1)

      # Capability summary logged on all platforms for auditability
      - name: Print sandbox capabilities
        run: |
          python -c "
          from velix_agent.sandbox.manager import SandboxManager
          caps = SandboxManager().get_capabilities()
          print('filesystem_isolation :', caps.filesystem_isolation)
          print('network_isolation    :', caps.network_isolation)
          print('timeout              :', caps.timeout)
          print('output_limit         :', caps.output_limit)
          print('secret_filtering     :', caps.secret_filtering)
          print('memory_limit         :', caps.memory_limit)
          print('process_limit        :', caps.process_limit)
          print('disk_limit           :', caps.disk_limit)
          "

      # Platform backend unit tests
      - name: Run ${{ matrix.name }} backend unit tests
        timeout-minutes: 5
        run: |
          python -m pytest ${{ matrix.backend_test }} -v --tb=short

      # Real Bubblewrap integration tests on Linux (strictly enforced, no skips allowed)
      - name: Run real Bubblewrap integration tests (strictly enforced, Linux)
        if: runner.os == 'Linux'
        run: |
          python -c "
          import sys, pytest

          class StrictCountPlugin:
              def __init__(self):
                  self.passed = 0
                  self.failed = 0
                  self.skipped = 0
                  self._seen = set()

              def pytest_runtest_logreport(self, report):
                  # Count each test nodeid exactly once.
                  # Setup-phase skips (skipif markers) never produce a 'call'
                  # report, so we catch them in 'setup'. Call-phase outcomes
                  # (pass/fail/pytest.skip() in body) are caught in 'call'.
                  # Teardown is never used for counting.
                  if report.nodeid in self._seen:
                      return
                  if report.when == 'call':
                      self._seen.add(report.nodeid)
                      if report.passed:
                          self.passed += 1
                      elif report.failed:
                          self.failed += 1
                      elif report.skipped:
                          self.skipped += 1
                  elif report.when == 'setup' and report.skipped:
                      self._seen.add(report.nodeid)
                      self.skipped += 1

          node_ids = [
              'tests/unit/test_sandbox_linux.py::test_linux_backend_execution',
              'tests/unit/test_sandbox_linux.py::test_linux_backend_git_directory_isolation_real',
              'tests/unit/test_sandbox_linux.py::test_linux_backend_git_worktree_file_isolation_real',
              'tests/unit/test_sandbox_linux.py::test_linux_backend_git_missing_isolation_real',
          ]

          plugin = StrictCountPlugin()
          exit_code = pytest.main(['-v', '-ra', '--tb=short', *node_ids], plugins=[plugin])

          print(f'Results: passed={plugin.passed}, failed={plugin.failed}, skipped={plugin.skipped}')
          if exit_code != 0:
              print(f'ERROR: pytest exited with code {exit_code}')
              sys.exit(exit_code or 1)
          if plugin.failed > 0:
              print(f'ERROR: {plugin.failed} real integration test(s) failed')
              sys.exit(1)
          if plugin.skipped > 0:
              print(f'ERROR: {plugin.skipped} real integration test(s) were skipped; all must execute')
              sys.exit(1)
          if plugin.passed != 4:
              print(f'ERROR: Expected 4 passed tests, got {plugin.passed}')
              sys.exit(1)
          print('SUCCESS: All 4 real Bubblewrap integration tests executed and passed.')
          "

      # Cross-platform sandbox tests (run on all platforms)
      - name: Run cross-platform sandbox tests
        run: |
          python -m pytest tests/unit/test_sandbox_cross_platform.py -v --tb=short

      # Sandbox security tests (run on all platforms; platform capability skips apply)
      - name: Run sandbox security tests
        run: |
          python -m pytest tests/sandbox/test_sandbox_security.py -v --tb=short

      # Sandbox secrets integration tests (run on all platforms)
      - name: Run sandbox secrets integration tests
        run: |
          python -m pytest tests/sandbox/test_sandbox_secrets_integration.py -v --tb=short

      # Bounded sandbox stress tests (run on all platforms; POSIX-only tests skip on Windows)
      - name: Run bounded sandbox stress tests
        run: |
          python -m pytest tests/sandbox/test_sandbox_stress.py -v --tb=short

      # Code quality checks
      - name: Run Ruff
        run: |
          ruff check tests/sandbox/

      - name: Run Mypy (POSIX)
        if: runner.os != 'Windows'
        run: |
          mypy src/velix_agent/sandbox/

      - name: Run Mypy (Windows)
        if: runner.os == 'Windows'
        run: |
          mypy src/velix_agent/sandbox/ tests/unit/test_sandbox_windows.py --exclude "backends/(linux|macos)\.py$"
